name: IslandWars
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  BattleCore:
    path: Packages/BattleCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  IslandWars:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Island Wars
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [islandwars]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alp.islandwars
    dependencies:
      - target: IslandWarsWidget
      - package: BattleCore
  IslandWarsWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Island Wars
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alp.islandwars.widget
    dependencies:
      - package: BattleCore
